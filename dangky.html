<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - The Coffee House | HOANG DIEU</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        /* Phần Header Logo + Tiêu đề giống trang chủ */
        .brand-header {
            background-color: #ffffff;
            padding: 15px 0 10px 0;
        }
        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #2c221e;
            margin: 0;
            text-align: center;
        }
        /* Thanh Navbar màu nâu giống trang chủ */
        .coffee-navbar {
            background-color: #6b4c35;
            padding: 8px 16px;
        }
        .coffee-navbar .nav-link {
            color: #f3ece7;
            font-size: 0.9rem;
            padding: 6px 12px;
        }
        .coffee-navbar .nav-link:hover,
        .coffee-navbar .nav-link.active {
            color: #ffffff;
            font-weight: 600;
        }
        .search-form input {
            font-size: 0.85rem;
            border-radius: 4px;
            border: none;
            padding: 5px 10px;
            width: 190px;
        }
        .search-form button {
            background-color: #ffffff;
            color: #333333;
            font-size: 0.85rem;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            margin-left: 6px;
        }
        .search-form button:hover {
            background-color: #f2ebe6;
        }
        /* Khung Form ở giữa */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
            background-color: #faf8f6;
        }
        .auth-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 28px;
            border-radius: 8px;
            border: 1px solid #e5dcd5;
            box-shadow: 0 3px 12px rgba(107, 76, 53, 0.08);
        }
        .auth-title {
            color: #6b4c35;
            font-weight: 700;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #3e2e23;
            margin-bottom: 5px;
        }
        .form-control {
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #d5c8be;
        }
        .form-control:focus {
            border-color: #6b4c35;
            box-shadow: 0 0 0 0.2rem rgba(107, 76, 53, 0.2);
        }
        .btn-coffee {
            background-color: #6b4c35;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 9px;
            border: none;
            border-radius: 5px;
            width: 100%;
            margin-top: 8px;
        }
        .btn-coffee:hover {
            background-color: #543b28;
            color: #ffffff;
        }
        .auth-link {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
            color: #555555;
        }
        .auth-link a {
            color: #6b4c35;
            font-weight: 600;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        footer {
            background-color: #6b4c35;
            color: #f3ece7;
            text-align: center;
            padding: 12px 0;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="container-fluid px-4">
            <div class="row align-items-center">
                <div class="col-4 col-md-3">
                    <a href="index.html" class="text-decoration-none">
                        <img src="IMAGES/logo/logo3.png" alt="" style="max-height: 55px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div style="display:none; color:#4a3321; font-weight:bold; line-height:1.1;">
                            <span style="font-size: 1rem;">HOANG DIEU</span><br>
                            <small style="font-size: 0.6rem; letter-spacing: 1px;">COFFEE WEB</small>
                        </div>
                    </a>
                </div>
                <div class="col-8 col-md-6">
                    <h1 class="brand-title">The Coffee House</h1>
                </div>
                <div class="col-md-3 d-none d-md-block"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <nav class="navbar navbar-expand-lg coffee-navbar">
            <div class="container-fluid px-2">
                <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainMenu">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
                        <li class="nav-item"><a class="nav-link" href="detail.html">Giới Thiệu</a></li>
                        <li class="nav-item"><a class="nav-link" href="product.html">Sản Phẩm</a></li>
                        <li class="nav-item"><a class="nav-link" href="giohang.html">Giỏ hàng</a></li>
                        <li class="nav-item"><a class="nav-link" href="new.html">Tin tức</a></li>
                        <li class="nav-item"><a class="nav-link" href="dangnhap.html">Đăng nhập</a></li>
                    </ul>
                    <form class="d-flex search-form" role="search">
                        <input type="search" placeholder="Search" aria-label="Search">
                        <button type="button">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>

    <main class="main-content">
        <div class="auth-card">
            <h2 class="auth-title">Đăng ký tài khoản</h2>
            <form>
                <div class="mb-3">
                    <label for="fullname" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên">
                </div>
                <div class="mb-3">
                    <label for="reg-username" class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="reg-username" placeholder="Nhập tên đăng nhập">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email">
                </div>
                <div class="mb-3">
                    <label for="reg-password" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="reg-password" placeholder="Nhập mật khẩu">
                </div>
                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Nhập lại mật khẩu</label>
                    <input type="password" class="form-control" id="confirm-password" placeholder="Nhập lại mật khẩu">
                </div>
                <button type="submit" class="btn-coffee">Đăng ký</button>
                <div class="auth-link">
                    Đã có tài khoản? <a href="dangnhap.html">Đăng nhập</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 HOANG DIEU - The Coffee House. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
