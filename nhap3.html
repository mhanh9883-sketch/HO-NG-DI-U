
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng của bạn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h2 {
            font-weight: bold;
            margin-bottom: 25px;
        }

        .table thead {
            background-color: #f1f8f4;
        }

        .table thead th {
            background-color: #f1f8f4;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #4b9f63;
        }

        .table tbody td {
            text-align: center;
            vertical-align: middle;
            padding: 20px;
        }

        .product-name {
            font-weight: bold;
        }

        .product-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .quantity {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quantity button {
            width: 45px;
            height: 35px;
            border: 1px solid #ddd;
            background-color: #eee;
            font-size: 20px;
        }

        .quantity input {
            width: 75px;
            height: 35px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .btn-delete {
            border: 1px solid #a65c52;
            color: #a65c52;
            background-color: white;
            padding: 7px 18px;
            border-radius: 8px;
        }

        .btn-delete:hover {
            background-color: #a65c52;
            color: white;
        }

        .total {
            font-size: 25px;
            text-align: right;
            margin-top: 25px;
        }

        .total span {
            color: #a94442;
            font-weight: bold;
        }

        .btn-payment {
            background-color: #4b9f63;
            color: white;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 10px;
        }

        .btn-payment:hover {
            background-color: #39834f;
            color: white;
        }
    </style>
</head>

<body>

<div class="container-fluid px-3">

    <h2>GIỎ HÀNG CỦA BẠN</h2>

    <div class="table-responsive">

        <table class="table" id="cart">

            <thead>
                <tr>
                    <th>STT</th>
                    <th>Sản phẩm</th>
                    <th>Hình</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td class="product-name">Bạc xĩu</td>
                    <td>
                        <img src="IMAGES/bacxiu/bx10.jpg" class="product-img">
                    </td>
                    <td class="price" data-price="12000">12000 VND</td>
                    <td>
                        <div class="quantity">
                            <button onclick="changeQty(this, -1)">−</button>
                            <input type="number" value="2" min="1" readonly>
                            <button onclick="changeQty(this, 1)">+</button>
                        </div>
                    </td>
                    <td class="subtotal">24000 VND</td>
                    <td>
                        <button class="btn-delete" onclick="deleteProduct(this)">Xóa</button>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td class="product-name">Bánh Sừng Bò</td>
                    <td>
                        <img src="IMAGES/banh/bsb11.jpg" class="product-img">
                    </td>
                    <td class="price" data-price="10000">10000 VND</td>
                    <td>
                        <div class="quantity">
                            <button onclick="changeQty(this, -1)">−</button>
                            <input type="number" value="1" min="1" readonly>
                            <button onclick="changeQty(this, 1)">+</button>
                        </div>
                    </td>
                    <td class="subtotal">10000 VND</td>
                    <td>
                        <button class="btn-delete" onclick="deleteProduct(this)">Xóa</button>
                    </td>
                </tr>

                <tr>
                    <td>3</td>
                    <td class="product-name">Trà Đá</td>
                    <td>
                        <img src="IMAGES/trada/tra2.jpg" class="product-img">
                    </td>
                    <td class="price" data-price="11000">11000 VND</td>
                    <td>
                        <div class="quantity">
                            <button onclick="changeQty(this, -1)">−</button>
                            <input type="number" value="1" min="1" readonly>
                            <button onclick="changeQty(this, 1)">+</button>
                        </div>
                    </td>
                    <td class="subtotal">11000 VND</td>
                    <td>
                        <button class="btn-delete" onclick="deleteProduct(this)">Xóa</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <div class="d-flex justify-content-end align-items-center gap-4 flex-wrap">

        <div class="total">
            Tổng thành tiền:
            <span id="total">45000 VND</span>
        </div>

        <button class="btn btn-payment" onclick="payment()">
            THANH TOÁN
        </button>

    </div>

</div>


<script>

    function changeQty(button, value) {

        let row = button.closest("tr");
        let input = row.querySelector("input");
        let quantity = parseInt(input.value);

        quantity += value;

        if (quantity < 1) {
            quantity = 1;
        }

        input.value = quantity;

        updateCart();
    }


    function updateCart() {

        let rows = document.querySelectorAll("#cart tbody tr");
        let total = 0;

        rows.forEach((row, index) => {

            let price = parseInt(
                row.querySelector(".price").dataset.price
            );

            let quantity = parseInt(
                row.querySelector("input").value
            );

            let subtotal = price * quantity;

            row.querySelector(".subtotal").innerText =
                subtotal + " VND";

            row.cells[0].innerText = index + 1;

            total += subtotal;

        });

        document.getElementById("total").innerText =
            total + " VND";
    }


    function deleteProduct(button) {

        button.closest("tr").remove();

        updateCart();
    }


    function payment() {

        let total = document.getElementById("total").innerText;

        if (document.querySelectorAll("#cart tbody tr").length === 0) {
            alert("Giỏ hàng của bạn đang trống!");
            return;
        }

        alert("Tổng tiền thanh toán: " + total);
    }

</script>

</body>
</html>
