<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giao diện cửa hàng</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: white;
        }

        /* Ô xanh phía trên */
        .header {
            height: 135px;
            background-color: #4775c5;
            border: 2px solid #26354d;
            margin: 10px 12px 15px;
        }

        /* Thanh màu kem */
        .thanh-kem {
            height: 40px;
            background-color: #fce5d8;
            border: 2px solid #26354d;
            margin-bottom: 10px;
        }

        /* Khung danh mục bên trái */
        .danh-muc {
            min-height: 440px;
            background-color: #f4b183;
            border: 2px solid #26354d;
            padding: 10px;
        }

        /* Bốn ô xanh ở giữa */
        .o-xanh {
            height: 112px;
            background-color: #4775c5;
            border: 2px solid #26354d;
        }

        /* Ô xanh phía dưới */
        .footer {
            height: 135px;
            background-color: #4775c5;
            border: 2px solid #26354d;
            margin: 20px 12px 0;
        }
    </style>
</head>

<body>

    <!-- Ô xanh phía trên -->
    <div class="header"></div>

    <!-- Khu vực nội dung -->
    <div class="container-fluid">
        <div class="row justify-content-center">

            <!-- Cột nội dung chính -->
            <div class="col-10">

                <!-- Thanh màu kem -->
                <div class="thanh-kem"></div>

                <div class="row g-2">

                    <!-- Khung danh mục bên trái -->
                    <div class="col-3">
                        <div class="danh-muc">
                            <!-- Nội dung danh mục sẽ thêm sau -->
                        </div>
                    </div>

                    <!-- Khu vực 4 ô xanh -->
                    <div class="col-9">
                        <div class="row g-2">

                            <div class="col-3">
                                <div class="o-xanh"></div>
                            </div>

                            <div class="col-3">
                                <div class="o-xanh"></div>
                            </div>

                            <div class="col-3">
                                <div class="o-xanh"></div>
                            </div>

                            <div class="col-3">
                                <div class="o-xanh"></div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Ô xanh phía dưới -->
    <div class="footer"></div>

</body>
</html>
